# web EC2 에서 실행하는 nginx (리버스 프록시)
name: ooga-nginx

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ooga-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - /etc/ooga/env
    volumes:
      # nginx 이미지가 시작할 때 ${APP_PRIVATE_IP} 를 치환해 /etc/nginx/conf.d/default.conf 를 만든다
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
